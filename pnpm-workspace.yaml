packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@iconify-json/vscode-icons": 1.2.75
  "@types/node": ^24.19.1
  "@unhead/vue": 3.3.2
  extend: 3.0.2
  libphonenumber-js: ^1.13.15
  reka-ui: 2.10.3
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vite-plus: 0.2.6
  wrangler: ^4.147.0
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  vue-demi: true
  workerd: true
minimumReleaseAgeExclude:
  - "@iconify-json/lucide@1.2.125"
patchedDependencies:
  # Modal scroll locks must follow preview portals into their iframe document.
  reka-ui@2.10.3: patches/reka-ui@2.10.3.patch
  undocs-nightly@0.10.1-20260828-133553-e5fe415: patches/undocs-nightly@0.10.1-20260828-133553-e5fe415.patch
