name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ready runs the illustration check, vp check, unit tests, and the docs build.
      - run: pnpm ready
